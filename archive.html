<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8B0000" />
    <meta name="description" content="Genecode archive — past sold-out drops." />
    <title>Archive — GENECODE</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="archive-page">
    <a class="skip-link" href="#archive">Skip to archive</a>

    <header class="site-header site-header--solid" id="site-header">
      <div class="site-header__inner">
        <a class="site-header__brand" href="index.html" aria-label="Genecode home">
          <img class="site-header__logo" src="assets/logo.png" width="120" height="32" alt="" />
        </a>
        <nav class="site-header__nav" aria-label="Site">
          <span class="site-header__wordmark" aria-hidden="true">GENECODE</span>
        </nav>
      </div>
    </header>

    <main>
      <section class="archive-hero" id="archive" aria-labelledby="archive-heading">
        <div class="archive-hero__inner">
          <h1 class="archive-hero__title" id="archive-heading">ARCHIVE</h1>
          <p class="archive-hero__subtitle">Past drops. Sold out. Still part of the code.</p>
          <a class="archive-hero__back" href="index.html">← Back to current drop</a>
        </div>
      </section>

      <div class="archive-root" id="archive-root"></div>
    </main>

    <footer class="site-footer" id="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__brand">
          <img class="site-footer__logo" src="assets/logo-dark.png" width="160" height="40" alt="" />
          <p class="site-footer__tagline">Sharp silhouettes. Quiet confidence.</p>
        </div>
        <nav class="site-footer__nav" aria-label="Explore">
          <h3 class="site-footer__nav-heading">Explore</h3>
          <ul class="site-footer__links">
            <li><a class="site-footer__link" href="index.html">Home</a></li>
            <li><a class="site-footer__link" href="archive.html" aria-current="page">Vault</a></li>
            <li>
              <a class="site-footer__link" id="footer-instagram" href="#" rel="noopener noreferrer" target="_blank"></a>
            </li>
          </ul>
        </nav>
        <div class="site-footer__order">
          <h3 class="site-footer__nav-heading">Order</h3>
          <a
            class="site-footer__link site-footer__link--cta"
            id="footer-whatsapp"
            href="#"
            rel="noopener noreferrer"
            target="_blank"
            >WhatsApp</a
          >
        </div>
        <p class="site-footer__meta" id="footer-active-drop"></p>
        <p class="site-footer__legal" id="footer-copyright"></p>
      </div>
    </footer>

    <div class="shirt-detail" id="shirt-detail" hidden aria-hidden="true">
      <div class="shirt-detail__backdrop" data-detail-close></div>
      <div class="shirt-detail__panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <button type="button" class="shirt-detail__close" data-detail-close aria-label="Close">×</button>
        <div class="shirt-detail__content" id="shirt-detail-content"></div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/detail-modal.js"></script>
    <script src="js/archive.js" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
